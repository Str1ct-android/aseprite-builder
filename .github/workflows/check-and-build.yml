name: Check & Build Aseprite

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-build
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build_needed: ${{ steps.detect.outputs.build_needed }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326740d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Check upstream
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check-update.py

      - name: Commit tracker
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "data: refresh (${{ steps.detect.outputs.version }})"
          file_pattern: docs/data.json

  build:
    needs: detect
    if: needs.detect.outputs.build_needed == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326740d5838078e36cf38b85af677262 # v4

      - name: Meta
        id: meta
        shell: pwsh
        run: |
          $d = Get-Content docs/data.json -Raw | ConvertFrom-Json
          $l = $d.latest
          $ver = [string]$l.version
          if ($ver -notmatch '^v?[0-9A-Za-z.\-]+$') { Write-Error "invalid version: $ver"; exit 1 }
          $url = [string]$l.source_url
          if ($url -notmatch '^https://github\.com/[^/]+/[^/]+/releases/download/.+$') { Write-Error "invalid source_url"; exit 1 }
          "ASE_VER=$ver" >> $env:GITHUB_OUTPUT
          "SOURCE_URL=$url" >> $env:GITHUB_OUTPUT
          $enc = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("$PWD\changelog.md", $l.changelog, $enc)

      - name: Long paths
        run: git config --system core.longpaths true

      - name: Tools
        run: choco install ninja innosetup -y --no-progress

      - name: Skia tag
        id: skiaver
        shell: pwsh
        run: |
          $r = (iwr -UseBasicParsing -Headers @{'User-Agent'='aseprite-builder'} https://api.github.com/repos/aseprite/skia/releases/latest).Content | ConvertFrom-Json
          $t = [string]$r.tag_name
          if ($t -notmatch '^v?[0-9A-Za-z._-]+$') { Write-Error "invalid skia tag"; exit 1 }
          "tag=$t" >> $env:GITHUB_OUTPUT

      - name: Cache Skia
        id: skia_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: skia
          key: skia-${{ steps.skiaver.outputs.tag }}-win-x64

      - name: Skia
        if: steps.skia_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          iwr -UseBasicParsing -Uri "https://github.com/aseprite/skia/releases/download/${{ steps.skiaver.outputs.tag }}/Skia-Windows-Release-x64.zip" -OutFile skia.zip
          New-Item -ItemType Directory -Force skia | Out-Null
          7z x skia.zip -oskia -y

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Source
        env:
          SRC: ${{ steps.meta.outputs.SOURCE_URL }}
        shell: pwsh
        run: |
          iwr -UseBasicParsing -Uri $env:SRC -OutFile src.zip
          7z x src.zip -otmp -y
          $root = (Get-ChildItem tmp -Directory | Select-Object -First 1).FullName
          if (-not (Test-Path "$root\CMakeLists.txt")) { Write-Error "unexpected source layout"; exit 1 }
          New-Item -ItemType Directory -Force aseprite | Out-Null
          Move-Item "$root\*" aseprite -Force

      - name: Configure
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE aseprite
          $skia = Join-Path $env:GITHUB_WORKSPACE skia
          New-Item -ItemType Directory -Force build | Out-Null
          Set-Location build
          cmake -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DLAF_BACKEND=skia `
            -DSKIA_DIR="$skia" `
            -DSKIA_LIBRARY_DIR="$skia\out\Release-x64" `
            -DSKIA_LIBRARY="$skia\out\Release-x64\skia.lib" `
            -DENABLE_UPDATER=OFF `
            -DENABLE_TESTS=OFF `
            "$src"

      - name: Compile
        run: |
          cd build
          ninja aseprite

      - name: Runtime DLLs
        shell: pwsh
        run: |
          $bin = Join-Path $env:GITHUB_WORKSPACE build\bin
          $cands = @(
            "$env:ProgramFiles\OpenSSL-Win64\bin",
            "${env:ProgramFiles(x86)}\OpenSSL-Win64\bin",
            "$env:ProgramFiles\OpenSSL\bin",
            "C:\vcpkg\installed\x64-windows\bin"
          )
          $src = $cands | Where-Object { Test-Path "$_\libcrypto-3-x64.dll" } | Select-Object -First 1
          if ($src) {
            Copy-Item "$src\libcrypto-3-x64.dll","$src\libssl-3-x64.dll" -Destination $bin -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "OpenSSL DLLs not found at known paths"
          }

      - name: Installer
        env:
          ASE_VER: ${{ steps.meta.outputs.ASE_VER }}
        shell: pwsh
        run: |
          $bin = Join-Path $env:GITHUB_WORKSPACE build\bin
          $ver = $env:ASE_VER
          $iss = @"
          [Setup]
          AppName=Aseprite
          AppVersion=$ver
          DefaultDirName={autopf}\Aseprite
          DefaultGroupName=Aseprite
          OutputBaseFilename=aseprite-setup
          OutputDir=installer
          Compression=lzma
          SolidCompression=yes
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          [Tasks]
          Name: "desktopicon"; Description: "Desktop icon"; GroupDescription: "Shortcuts:"
          [Files]
          Source: "$bin\*"; DestDir: "{app}"; Excludes: "*.pdb"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\Aseprite"; Filename: "{app}\aseprite.exe"
          Name: "{commondesktop}\Aseprite"; Filename: "{app}\aseprite.exe"; Tasks: desktopicon
          "@
          New-Item -ItemType Directory -Force installer | Out-Null
          $enc = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("$PWD\aseprite.iss", $iss, $enc)
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" aseprite.iss

      - name: Installer SHA-256
        id: hash
        shell: pwsh
        run: |
          $h = (Get-FileHash installer\aseprite-setup.exe -Algorithm SHA256).Hash
          Write-Host "sha256: $h"
          "SHA=$h" >> $env:GITHUB_OUTPUT

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aseprite-${{ steps.meta.outputs.ASE_VER }}
          path: installer/aseprite-setup.exe
          retention-days: 90
          if-no-files-found: error

      - name: Ready
        env:
          ASE_VER: ${{ steps.meta.outputs.ASE_VER }}
          SHA: ${{ steps.hash.outputs.SHA }}
        shell: pwsh
        run: |
          $d = Get-Content docs/data.json -Raw | ConvertFrom-Json
          $d.latest.build_status = "ready"
          $d.latest.download_url = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $d.latest.artifact = "aseprite-$($env:ASE_VER)"
          $d.latest.installer_sha256 = $env:SHA
          $d.latest.built_at = (Get-Date).ToUniversalTime().ToString("o")
          $json = $d | ConvertTo-Json -Depth 10
          $enc = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("$PWD\docs\data.json", $json, $enc)

      - name: Commit status
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "data: ready ${{ steps.meta.outputs.ASE_VER }}"
          file_pattern: docs/data.json

      - name: Notify Telegram
        if: success() && env.TG_BOT_TOKEN != '' && env.TG_CHAT_ID != ''
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ASE_VER: ${{ steps.meta.outputs.ASE_VER }}
          SHA: ${{ steps.hash.outputs.SHA }}
        shell: pwsh
        run: |
          Write-Host "::add-mask::$env:TG_BOT_TOKEN"
          $run  = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $msg  = "Aseprite $env:ASE_VER build ready.`n`nsha256: $env:SHA`nInstaller (private artifact): $run"
          $body = @{ chat_id = $env:TG_CHAT_ID; text = $msg; disable_web_page_preview = "true" } | ConvertTo-Json
          try {
            $r = iwr -UseBasicParsing -Method Post -Uri "https://api.telegram.org/bot$env:TG_BOT_TOKEN/sendMessage" -ContentType "application/json" -Body $body
            Write-Host "telegram: sent $($r.StatusCode)"
          } catch {
            $code = $_.Exception.Response.StatusCode.value__
            Write-Host "telegram: failed HTTP $code"
          }

      - name: Notify Telegram on failure
        if: failure() && env.TG_BOT_TOKEN != '' && env.TG_CHAT_ID != ''
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ASE_VER: ${{ steps.meta.outputs.ASE_VER }}
        shell: pwsh
        run: |
          Write-Host "::add-mask::$env:TG_BOT_TOKEN"
          $run  = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $msg  = "Aseprite $env:ASE_VER build FAILED. Check logs:`n$run"
          $body = @{ chat_id = $env:TG_CHAT_ID; text = $msg; disable_web_page_preview = "true" } | ConvertTo-Json
          try {
            iwr -UseBasicParsing -Method Post -Uri "https://api.telegram.org/bot$env:TG_BOT_TOKEN/sendMessage" -ContentType "application/json" -Body $body | Out-Null
            Write-Host "telegram: failure notice sent"
          } catch {
            Write-Host "telegram: failure notice failed"
          }

      - name: Failed
        if: failure()
        shell: pwsh
        run: |
          $d = Get-Content docs/data.json -Raw | ConvertFrom-Json
          $d.latest.build_status = "failed"
          $json = $d | ConvertTo-Json -Depth 10
          $enc = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("$PWD\docs\data.json", $json, $enc)

      - name: Commit fail
        if: failure()
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "data: build failed ${{ steps.meta.outputs.ASE_VER }}"
          file_pattern: docs/data.json
