name: Auto-merge deps

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  classify:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.cls.outputs.semver }}
    steps:
      - name: Classify update
        id: cls
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -eu
          title="$PR_TITLE"
          from=$(printf '%s' "$title" | sed -nE 's/.*from ([0-9]+)\.[0-9]+\.[0-9]+ to.*/\1/p')
          to=$(printf '%s' "$title" | sed -nE 's/.*to ([0-9]+)\.[0-9]+\.[0-9]+.*/\1/p')
          echo "from_major=$from to_major=$to"
          if [ -z "$from" ] || [ -z "$to" ]; then
            echo "semver=unknown" >> "$GITHUB_OUTPUT"
          elif [ "$from" = "$to" ]; then
            echo "semver=minor" >> "$GITHUB_OUTPUT"
          else
            echo "semver=major" >> "$GITHUB_OUTPUT"
          fi

  merge:
    needs: classify
    if: needs.classify.outputs.semver == 'minor'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for minor/patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_NODE: ${{ github.event.pull_request.node_id }}
        run: |
          set -eu
          # enable auto-merge (squash) so GitHub merges after checks pass
          gh api graphql -f query='
            mutation($id:ID!){ enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:SQUASH}){ pullRequest{ number } } }' -F id="$PR_NODE" || true
          echo "Auto-merge enabled for PR #$PR_NUMBER (minor/patch update). Will merge once checks pass."
